name: Reconciliation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run evaluate:ai --workspace @reconciledesk/api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r services/ai/requirements.txt
      - run: python -m pytest services/ai/tests -q
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: docker compose exec -T api npm run smoke --workspace @reconciledesk/api
      - run: docker compose exec -T api npm run verify:db --workspace @reconciledesk/api
      - run: docker compose exec -T api node apps/api/dist/seed-demo.js --json | docker compose exec -T api node apps/api/dist/verify-data.js
      - if: always()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down
